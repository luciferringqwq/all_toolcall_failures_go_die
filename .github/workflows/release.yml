name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(cat <<'EOF'
          《所有的工具调用失败都给我tm去死吧插件》

          在 AFTER_LLM_REQUEST 处拦截坏掉的工具调用与纯文本：
          先零 token 本地修复/套壳，必要时用一次极简提示词请求第二个 LLM。
          自动识别当前 chatter 的发送工具（send_text / kfc_reply ...）。
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.mfp --clobber
          else
            gh release create "$TAG" dist/*.mfp \
              --title "$TAG" --notes "$NOTES"
          fi
